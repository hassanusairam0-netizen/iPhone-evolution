<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone Evolution</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen showroom. Info column left, rotating 3D stage right, year rail along the bottom. Single dark look by choice. */
:root{
  --ink:#0a0b0e; --panel:#13151a; --line:#252831; --fg:#eceef2; --mute:#8d929e;
  --accent:#e8743b;
  --display:"Archivo",system-ui,sans-serif; --body:"Archivo",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr auto;min-height:100%;max-width:1320px;margin:0 auto;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px 4px}
.brand{font-family:var(--display);font-weight:700;font-stretch:112%;letter-spacing:.01em;font-size:15px;display:flex;align-items:center;gap:10px}
.brand svg{width:16px;height:16px;fill:var(--fg)}
.credit{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);
  padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--panel);white-space:nowrap}
.credit b{color:var(--accent);font-weight:500;transition:color .6s}
main{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:center;min-height:0}
.info{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{color:var(--ink);background:var(--accent);padding:2px 8px;border-radius:4px;letter-spacing:.08em;transition:background .6s}
h1{font-family:var(--display);font-stretch:72%;font-weight:800;font-size:clamp(44px,6vw,76px);line-height:.92;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{font-size:16px;line-height:1.55;color:#c4c8d1;margin:0;max-width:38ch}
dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0;padding-top:16px;border-top:1px solid var(--line)}
dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:2px}
dd{margin:0;font-size:15px;font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .2s}
.sw[aria-pressed="true"]{border-color:var(--fg);transform:scale(1.12)}
.swname{font-family:var(--mono);font-size:12px;color:var(--mute);margin-left:4px}

.stage{position:relative;height:min(68vh,620px);min-height:440px;border-radius:28px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 10%,#171a21 0%,var(--ink) 70%);border:1px solid var(--line);touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.bigyear{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-stretch:62%;
  font-size:clamp(160px,30vw,380px);line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.09);user-select:none;pointer-events:none;letter-spacing:-.02em}
.glow{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle,var(--accent) 0%,transparent 62%);opacity:.22;filter:blur(30px);transition:background .8s;pointer-events:none}
.floor{position:absolute;left:50%;bottom:10%;width:260px;height:30px;margin-left:-130px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);pointer-events:none}
.scene{position:absolute;inset:0;perspective:1700px;display:grid;place-items:center;pointer-events:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.group{display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(19,21,26,.78);backdrop-filter:blur(10px);border:1px solid var(--line);align-items:center}
.group button{border:0;background:transparent;padding:7px 12px;border-radius:99px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.group button:hover{color:var(--fg)}
.group button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.group label{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;padding-left:10px}
input[type=range]{width:90px;accent-color:var(--accent)}
.hint{position:absolute;top:14px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;pointer-events:none}

.rail{display:flex;align-items:stretch;gap:8px;padding-block:6px 18px}
.arrow{flex:none;width:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:18px}
.track{position:relative;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.track::-webkit-scrollbar{display:none}
.yr{flex:none;scroll-snap-align:center;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;text-align:left;min-width:112px;position:relative;transition:border-color .3s,background .3s}
.yr small{display:block;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.06em}
.yr span{display:block;font-family:var(--display);font-stretch:85%;font-weight:600;font-size:14px;margin-top:3px;white-space:nowrap}
.yr[aria-current="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.yr .dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%}
.bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:-14px;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s,background .6s}

@media (max-width:860px){
  main{grid-template-columns:1fr}
  .stage{order:-1;height:58vh;min-height:400px}
  h1{font-size:46px}
  .credit{font-size:10px;padding:6px 10px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){.fit,.glow,.bar i{transition:none}}
</style>
</head>

<div class="app">
  <header>
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="applePath" d="M16.37 1.43c0 1.14-.49 2.27-1.18 3.08-.74.9-1.99 1.57-2.99 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.57-2.27 1.21-2.98.8-.94 2.14-1.64 3.25-1.68.03.13.05.28.05.43zm4.56 15.71c-.03.07-.46 1.58-1.52 3.12-.94 1.34-1.94 2.71-3.43 2.71-1.52 0-1.9-.88-3.63-.88-1.7 0-2.3.91-3.67.91-1.38 0-2.33-1.26-3.43-2.8-1.29-1.82-2.32-4.63-2.32-7.28 0-4.28 2.8-6.55 5.55-6.55 1.45 0 2.68.95 3.6.95.87 0 2.22-1.01 3.9-1.01.61 0 2.89.06 4.37 2.19-.13.09-2.38 1.37-2.38 4.19 0 3.26 2.85 4.42 2.96 4.45z"/></svg>iPhone Evolution <span style="color:var(--mute);font-weight:400">· 2007 → 2026</span></div>
    <div class="credit">Made by <b>Usairam Hassan</b></div>
  </header>

  <main>
    <section class="info" aria-live="polite">
      <div class="eyebrow"><span id="idx">Model 01 / 19</span><span id="yearTxt">2007</span><span class="tag" id="tag" hidden>Projected</span></div>
      <h1 id="name">iPhone</h1>

      <dl>
        <dt>Chip</dt><dd id="chip"></dd>

        <dt>Camera</dt><dd id="cam"></dd>

    <section class="stage" id="stage" aria-label="3D model, drag to rotate">

      <div class="hint">Drag to rotate · ← → to switch</div>

        <div class="group" role="group" aria-label="View">
          <button id="vFront">Front</button><button id="vSide">Side</button><button id="vBack">Back</button>
        </div>
        <div class="group">
          <button id="play" aria-pressed="true">Spin</button>
          <label for="speed">Speed</label><input type="range" id="speed" min="2" max="40" value="14">
          <button id="tour" aria-pressed="false">Tour</button>
          <button id="cmp" aria-pressed="false">vs 2007</button>
        </div>
      </div>
    </section>
  </main>

  <div>
    <div class="rail">
      <button class="arrow" id="prev" aria-label="Previous model">←</button>
      <div class="track" id="track"></div>
      <button class="arrow" id="next" aria-label="Next model">→</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
  </div>
</div>

  const dist=Math.max(100/t,74/(t*cam.aspect));cam.position.set(0,45,dist);cam.lookAt(0,-12,0);cam.updateProjectionMatrix();
}
function go(i,keep){if(swap)return;cur=(i+M.length)%M.length;if(!keep)colIdx=0;swap={t:0,out:true}}
$('track').innerHTML=M.map((m,i)=>`<button class="yr" data-i="${i}"><i class="dot" style="background:${m.colors[0].back}"></i><small>${m.y}${m.tag?' · '+m.tag:''}</small><span>${m.n}</span></button>`).join('');
$('track').onclick=e=>{const b=e.target.closest('.yr');if(b)go(+b.dataset.i)};
$('sw').onclick=e=>{const b=e.target.closest('.sw');if(b){colIdx=+b.dataset.i;build();info()}};
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
const snap=a=>{const base=Math.round(ry/360)*360;target=base+a;if(target-ry>180)target-=360;if(ry-target>180)target+=360};
$('vFront').onclick=()=>snap(0);$('vSide').onclick=()=>snap(-90);$('vBack').onclick=()=>snap(180);
const setPlay=v=>{playing=v;$('play').setAttribute('aria-pressed',v)};
$('play').onclick=()=>setPlay(!playing);
let tourT=null;
$('tour').onclick=()=>{const on=!tourT;$('tour').setAttribute('aria-pressed',on);if(on){setPlay(true);tourT=setInterval(()=>go(cur+1),7000)}else{clearInterval(tourT);tourT=null}};
$('cmp').onclick=()=>{ghost.visible=!ghost.visible;$('cmp').setAttribute('aria-pressed',ghost.visible)};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key===' '&&e.target===document.body){e.preventDefault();setPlay(!playing)}});
let drag=null,resumeT=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.hud'))return;drag={x:e.clientX,y:e.clientY,was:playing||drag&&drag.was};playing=false;target=null;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-drag.x)*.45;rx=Math.max(-35,Math.min(35,rx+(e.clientY-drag.y)*.3));drag.x=e.clientX;drag.y=e.clientY});
const end=()=>{if(!drag)return;const w=drag.was;drag=null;clearTimeout(resumeT);resumeT=setTimeout(()=>{if(w)setPlay(true)},1600)};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
const D2R=Math.PI/180;let last=performance.now();
function tick(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(target!==null){ry+=(target-ry)*Math.min(1,dt*6);if(Math.abs(target-ry)<.2){ry=target;target=null;setPlay(false)}}
  else if(playing)ry+=dt*(+$('speed').value);
  if(!drag)rx+=(0-rx)*Math.min(1,dt*2);
  let s=1;
  if(swap){swap.t+=dt;
    if(swap.out){const k=Math.min(1,swap.t/.22);s=1-k*k;if(k>=1){build();info();swap={t:0,out:false}}}
    else{const k=Math.min(1,swap.t/.45);s=1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2);if(k>=1){s=1;swap=null}}}
  root.scale.setScalar(Math.max(.001,s));
  root.rotation.set(rx*D2R,ry*D2R,0);
  renderer.render(scene,cam);
  requestAnimationFrame(tick);
}
addEventListener('resize',resize);
setPlay(playing);resize();build();info();requestAnimationFrame(tick);
</script>
</body>
</html>
